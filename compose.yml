services:
  caddy:
    image: caddy:2
    container_name: fungame-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/gudwns1812/fungame-backend:latest}
    container_name: fungame-backend
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      # 관리 포트. 인프라 서버의 prometheus 가 사설망으로 긁어갑니다.
      # MANAGEMENT_BIND_IP 를 비우면 공개되므로 반드시 사설 IP 를 지정하세요.
      - "${MANAGEMENT_BIND_IP:-127.0.0.1}:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fungame
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      MAIL_FROM: ${MAIL_FROM}
      PASSWORD_RESET_LINK_BASE_URL: ${PASSWORD_RESET_LINK_BASE_URL}
      # 신고 알림을 받을 디스코드 웹훅. 정답과 힌트까지 실리므로 비공개 채널이어야 합니다.
      # 주소를 아는 사람은 누구나 그 채널에 메시지를 쏠 수 있으므로 .env 에만 둡니다.
      DISCORD_REPORT_WEBHOOK_URL: ${DISCORD_REPORT_WEBHOOK_URL}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: fungame-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fungame
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
