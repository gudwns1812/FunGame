name: CI Backend

on:
  # 대상 브랜치를 가리지 않습니다. 스택으로 쌓은 PR 은 main 을 향하지 않아서,
  # branches: [main] 로 두면 그 PR 들만 검사 없이 통과합니다.
  pull_request:
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :backend:core:core-api:test

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/core/core-api/build/reports/tests/test
          retention-days: 7

  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
