name: CI Backend

on:
  # 대상 브랜치를 가리지 않습니다. 스택으로 쌓은 PR 은 main 을 향하지 않아서,
  # branches: [main] 로 두면 그 PR 들만 검사 없이 통과합니다.
  #
  # paths 로 거르지 않습니다. "백엔드 테스트" 는 main 의 필수 체크라, 거르면 프런트만 바꾼
  # PR 에서는 체크가 아예 뜨지 않아 머지가 영영 막힙니다. 거르는 일은 잡 안에서 합니다.
  pull_request:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 백엔드가 바뀌었는지 본다
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(backend/|build\.gradle$|settings\.gradle$|gradle/|gradlew|\.github/workflows/ci-backend\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "백엔드 변경이 없다. 테스트를 건너뛰고 통과로 둔다"
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v4

      - if: steps.changes.outputs.backend == 'true'
        run: ./gradlew :backend:core:core-api:test

      - if: always() && steps.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/core/core-api/build/reports/tests/test
          retention-days: 7

  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
