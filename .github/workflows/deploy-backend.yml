name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fungame-backend
  CONTAINER_NAME: songquiz-backend

jobs:
  build:
    name: 테스트와 이미지 빌드
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew :backend:test

      - id: meta
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: EC2 배포
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: IMAGE,CONTAINER_NAME,REGISTRY_USER,REGISTRY_TOKEN,ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            PREVIOUS_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo '')
            echo "현재 이미지: ${PREVIOUS_IMAGE:-없음}"

            docker pull "$IMAGE"

            start_container() {
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p 8080:8080 \
                --env-file "$ENV_FILE" \
                "$1"
            }

            wait_until_healthy() {
              for _ in $(seq 1 30); do
                code=$(curl -s -o /dev/null -w '%{http_code}' \
                  'http://localhost:8080/api/auth/check-id?loginId=healthcheck' || true)
                if [ "$code" = "200" ]; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            start_container "$IMAGE"

            if wait_until_healthy; then
              echo "배포 성공"
              docker image prune -f
              exit 0
            fi

            echo "새 이미지가 90초 안에 응답하지 않는다"
            docker logs --tail 100 "$CONTAINER_NAME" || true

            if [ -z "$PREVIOUS_IMAGE" ]; then
              echo "되돌릴 이전 이미지가 없다"
              exit 1
            fi

            echo "이전 이미지로 되돌린다: $PREVIOUS_IMAGE"
            start_container "$PREVIOUS_IMAGE"

            if wait_until_healthy; then
              echo "롤백 완료. 서비스는 이전 버전으로 살아 있다"
            else
              echo "롤백도 실패했다. 수동 확인이 필요하다"
            fi
            exit 1
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_FILE: ${{ secrets.BACKEND_ENV_FILE_PATH || '/home/ubuntu/.env' }}
