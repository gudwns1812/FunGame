name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fungame-backend

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :backend:core:core-api:test

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/core/core-api/build/reports/tests/test
          retention-days: 7

  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: EC2 배포
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # scp 는 되돌릴 수 없습니다. 어긋나 있으면 이 백업이 유일한 원본입니다.
      - name: 서버의 현재 배포 설정을 백업한다
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: PROJECT_DIR
          script_stop: true
          script: |
            set -euo pipefail

            cd "$PROJECT_DIR"
            mkdir -p .backup

            STAMP=$(date +%Y%m%d-%H%M%S)
            tar czf ".backup/config-$STAMP.tgz" compose.yml caddy
            echo "백업했다: .backup/config-$STAMP.tgz"

            # 최근 다섯 개만 남긴다
            ls -1t .backup/config-*.tgz | tail -n +6 | xargs -r rm -f
        env:
          PROJECT_DIR: ${{ secrets.BACKEND_PROJECT_DIR || '/home/ubuntu/fungame' }}

      # 서버의 compose.yml 과 Caddyfile 을 저장소의 것으로 덮어씁니다.
      # .env 는 보내지 않습니다. 비밀값이라 서버에만 있고 .gitignore 대상입니다.
      - name: 배포 설정을 서버로 보낸다
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: 'backend/compose.yml,backend/caddy/Caddyfile'
          strip_components: 1
          # 없으면 기존 파일을 건너뛰고 tar 가 File exists 로 죽는다
          overwrite: true
          target: ${{ secrets.BACKEND_PROJECT_DIR || '/home/ubuntu/fungame' }}

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: IMAGE_NAME,IMAGE_TAG,SERVICE,CONTAINER_NAME,REGISTRY_USER,REGISTRY_TOKEN,PROJECT_DIR,MAIL_USERNAME,MAIL_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail

            cd "$PROJECT_DIR"

            # Caddyfile 이 깨졌으면 백엔드를 건드리기 전에 멈춘다.
            docker run --rm -v "$PWD/caddy:/etc/caddy:ro" caddy:2 \
              caddy validate --config /etc/caddy/Caddyfile

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            TARGET_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

            if ! BACKEND_IMAGE="$TARGET_IMAGE" docker compose config --images "$SERVICE" \
                | grep -qx "$TARGET_IMAGE"; then
              echo "compose.yml 의 $SERVICE 가 BACKEND_IMAGE 를 반영하지 않는다"
              echo "이 상태로 배포하면 새 이미지가 아닌 compose.yml 에 적힌 이미지가 뜬다"
              echo "image: \${BACKEND_IMAGE:-${IMAGE_NAME}:latest} 로 바꿔야 한다"
              exit 1
            fi

            docker compose up -d redis

            PREVIOUS_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo '')
            echo "현재 이미지: ${PREVIOUS_IMAGE:-없음}"

            deploy_tag() {
              BACKEND_IMAGE="$1" docker compose pull "$SERVICE"
              BACKEND_IMAGE="$1" docker compose up -d --no-deps "$SERVICE"
            }

            wait_until_healthy() {
              for _ in $(seq 1 30); do
                if docker exec "$CONTAINER_NAME" \
                    wget -qO- 'http://localhost:8081/actuator/health' 2>/dev/null \
                    | grep -q '"status":"UP"'; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            set_env() {
              install -m 600 /dev/null .env.next
              if [ -f .env ]; then
                { grep -v "^$1=" .env || true; } >> .env.next
                chmod --reference=.env .env.next
              fi
              printf '%s=%s\n' "$1" "$2" >> .env.next
              mv .env.next .env
            }

            pin_running_image_in_env() {
              if [ "$1" = "${1%:latest}" ]; then
                set_env BACKEND_IMAGE "$1"
                echo ".env 에 고정했다: BACKEND_IMAGE=$1"
                echo "이제 서버에서 맨손으로 docker compose up -d 를 쳐도 이 버전이 뜬다"
              else
                echo "$1 은 움직이는 태그라 .env 에 고정하지 않는다"
                echo "서버의 로컬 latest 는 pull 하지 않는 한 옛 이미지에 머물러 있다"
              fi
            }

            # 바인드 마운트라 파일만 바뀌어서는 컨테이너가 눈치채지 못한다.
            reload_caddy() {
              if docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile; then
                echo "Caddy 가 설정을 다시 읽었다"
              else
                echo "reload 에 실패해 caddy 를 다시 띄운다"
                docker compose up -d caddy
              fi
            }

            # 비밀값은 서버에만 둔다. 컨테이너가 뜨기 전에 .env 를 Secret 과 맞춘다.
            set_env MAIL_USERNAME "$MAIL_USERNAME"
            set_env MAIL_PASSWORD "$MAIL_PASSWORD"

            # set -e 가 여기서 스크립트를 죽이면 아래 롤백 블록에 도달하지 못한다.
            # 기동 명령이 실패해도 일단 넘기고 헬스체크가 판정하게 둔다.
            if ! deploy_tag "$TARGET_IMAGE"; then
              echo "새 이미지 기동 명령이 실패했다. 헬스체크로 판정한다"
            fi

            if wait_until_healthy; then
              echo "배포 성공: $TARGET_IMAGE"
              reload_caddy
              pin_running_image_in_env "$TARGET_IMAGE"
              docker image prune -f
              exit 0
            fi

            echo "새 이미지가 90초 안에 응답하지 않는다"
            docker compose logs --tail 100 "$SERVICE" || true

            if [ -z "$PREVIOUS_IMAGE" ]; then
              echo "되돌릴 이전 이미지가 없다"
              exit 1
            fi

            echo "이전 이미지로 되돌린다: $PREVIOUS_IMAGE"
            if ! deploy_tag "$PREVIOUS_IMAGE"; then
              echo "이전 이미지 기동 명령도 실패했다"
            fi

            if wait_until_healthy; then
              echo "롤백 완료. 서비스는 이전 버전으로 살아 있다"
              pin_running_image_in_env "$PREVIOUS_IMAGE"
            else
              echo "롤백도 실패했다. 수동 확인이 필요하다"
            fi
            exit 1
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: backend
          CONTAINER_NAME: fungame-backend
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_DIR: ${{ secrets.BACKEND_PROJECT_DIR || '/home/ubuntu/fungame' }}
          MAIL_USERNAME: ${{ secrets.BREVO_SMTP_LOGIN }}
          MAIL_PASSWORD: ${{ secrets.BREVO_SMTP_KEY }}

      - name: 실패하면 설정을 직전 백업으로 되돌린다
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: PROJECT_DIR
          script_stop: false
          script: |
            set -uo pipefail

            cd "$PROJECT_DIR"

            LATEST=$(ls -1t .backup/config-*.tgz 2>/dev/null | head -1)
            if [ -z "$LATEST" ]; then
              echo "되돌릴 백업이 없다. 서버 설정을 손으로 확인해야 한다"
              exit 0
            fi

            echo "설정을 되돌린다: $LATEST"
            tar xzf "$LATEST"

            docker compose up -d --no-deps backend || true
            docker compose ps
        env:
          PROJECT_DIR: ${{ secrets.BACKEND_PROJECT_DIR || '/home/ubuntu/fungame' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: latest 태그를 방금 배포된 이미지로 옮긴다
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ github.sha }}"
