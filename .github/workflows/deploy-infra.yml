name: Deploy Infra

# fungame-infra 인스턴스 전용입니다. 앱(fungame)은 deploy-backend.yml 이 맡습니다.
# 두 파이프라인은 대상 호스트도 시크릿도 다릅니다.
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    name: fungame-infra 배포
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 접속에 필요한 시크릿이 하나라도 없으면 뒤 단계를 건너뜁니다.
      # secrets 컨텍스트는 job 레벨 if 에서 못 쓰므로 step 레벨에서 가릅니다.
      - id: guard
        env:
          INFRA_HOST: ${{ secrets.INFRA_HOST }}
          INFRA_USER: ${{ secrets.INFRA_USER }}
          INFRA_SSH_KEY: ${{ secrets.INFRA_SSH_KEY }}
        run: |
          missing=
          [ -n "$INFRA_HOST" ] || missing="$missing INFRA_HOST"
          [ -n "$INFRA_USER" ] || missing="$missing INFRA_USER"
          [ -n "$INFRA_SSH_KEY" ] || missing="$missing INFRA_SSH_KEY"

          if [ -n "$missing" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo "없는 시크릿이 있어 배포를 건너뛴다:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo '셋을 다 넣으면 그때부터 infra/** 변경이 fungame-infra 로 흐른다.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4

      # infra/ 아래 내용만 보냅니다. strip_components 로 infra/ 한 겹을 벗겨
      # 서버의 배포 디렉터리가 이 폴더와 같은 모양이 되게 합니다.
      - name: 설정을 fungame-infra 로 보낸다
        if: steps.guard.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.INFRA_HOST }}
          username: ${{ secrets.INFRA_USER }}
          key: ${{ secrets.INFRA_SSH_KEY }}
          port: ${{ secrets.INFRA_PORT || 22 }}
          source: 'infra/*'
          strip_components: 1
          # 없으면 기존 파일을 건너뛰고 tar 가 File exists 로 죽는다
          overwrite: true
          target: ${{ secrets.INFRA_PROJECT_DIR || '/opt/monitoring' }}

      - name: 스택을 올린다
        if: steps.guard.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.INFRA_HOST }}
          username: ${{ secrets.INFRA_USER }}
          key: ${{ secrets.INFRA_SSH_KEY }}
          port: ${{ secrets.INFRA_PORT || 22 }}
          envs: PROJECT_DIR
          script_stop: true
          script: |
            set -euo pipefail

            cd "$PROJECT_DIR"

            # 깨진 설정을 올리기 전에 멈춘다.
            docker compose config --quiet

            docker compose up -d
            docker compose ps
        env:
          PROJECT_DIR: ${{ secrets.INFRA_PROJECT_DIR || '/opt/monitoring' }}
