<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 배경 -->
  <rect width="16" height="16" fill="#d32f2f" />
  <!-- 안쪽 음영 -->
  <rect x="1" y="14" width="14" height="1" fill="#af101a" />
  <rect x="14" y="1" width="1" height="14" fill="#af101a" />
  <!-- 검정 테두리 (1px) -->
  <g fill="#1a1a1a">
    <rect width="16" height="1" />
    <rect y="15" width="16" height="1" />
    <rect width="1" height="16" />
    <rect x="15" width="1" height="16" />
  </g>
  <!-- 8분음표 -->
  <g fill="#ffffff">
    <rect x="6" y="3" width="6" height="2" />
    <rect x="6" y="5" width="1" height="7" />
    <rect x="11" y="5" width="1" height="6" />
    <rect x="3" y="10" width="3" height="3" />
    <rect x="8" y="9" width="3" height="3" />
  </g>
  <!-- 반짝임 -->
  <rect x="13" y="2" width="1" height="1" fill="#ffd44d" />
</svg>
