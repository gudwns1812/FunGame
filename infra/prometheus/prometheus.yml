global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  # 한 호스트에 백엔드가 둘입니다. 컨테이너 안은 양쪽 다 8081 이고 호스트에서만 갈라집니다.
  # instance 라벨을 주지 않으면 두 인스턴스의 값이 한 선으로 합쳐져 대시보드가 의미를 잃습니다.
  - job_name: fungame-backend
    metrics_path: /actuator/prometheus
    scheme: http

    static_configs:
      - targets:
          - "172.31.34.226:8081"
        labels:
          service: fungame-backend
          environment: production
          instance: blue
      - targets:
          - "172.31.34.226:8082"
        labels:
          service: fungame-backend
          environment: production
          instance: green

  - job_name: node
    static_configs:
      - targets:
          - "172.31.34.226:9100"
        labels:
          service: fungame-server
          environment: production
          instance: app-1
