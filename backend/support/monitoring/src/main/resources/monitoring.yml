management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus,traffic
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      namespace: ${METRICS_NAMESPACE:prod}
      # 한 호스트에 인스턴스가 둘이라 이 라벨이 없으면 대시보드가 둘을 합쳐 버립니다.
      instance: ${app.instance-id:local}
    distribution:
      # 응답시간 백분위를 내려면 버킷이 필요합니다. 기본 히스토그램은 버킷이 수십 개라
      # 엔드포인트 · 상태 코드마다 시계열이 불어나므로, 판단에 쓰는 경계만 둡니다.
      slo:
        http.server.requests: 50ms,100ms,300ms,1s,3s

logging:
  pattern:
    # 로그도 어느 인스턴스에서 난 것인지 보여야 합니다. compose 가 APP_INSTANCE_ID 를 넣습니다.
    level: "%5p [${app.instance-id:local}]"

---
spring:
  config:
    activate:
      on-profile: local
management:
  metrics:
    tags:
      namespace: local
