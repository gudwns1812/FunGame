# 로컬 개발용 프로파일. 외부 DB 없이 인메모리 H2 로 단독 기동합니다.
#
#   ./gradlew :backend:bootRun --args='--spring.profiles.active=local'
#
# 프론트엔드는 frontend 디렉터리에서 `npm run dev:local` 로 띄우면
# 아래 CORS 설정과 맞는 포트(5199)로 붙습니다.

cors:
  allowed-origins: "http://localhost:5199,http://127.0.0.1:5199"

server:
  port: 8080
  servlet:
    session:
      cookie:
        # http 로컬 개발에서는 Secure 쿠키가 전달되지 않으므로 반드시 false 여야 합니다.
        secure: false
        same-site: lax

spring:
  datasource:
    url: jdbc:h2:mem:songquiz;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 스키마는 Flyway 가 만듭니다. 엔티티와 어긋나면 기동 시점에 실패합니다.
      ddl-auto: validate
  flyway:
    # db/local 은 로컬 전용 시드입니다. 운영은 db/migration 만 실행합니다.
    locations: classpath:db/migration,classpath:db/local
  session:
    jdbc:
      initialize-schema: always

app:
  password-reset:
    # 로컬에서는 메일을 보내지 않고 이 주소로 만든 링크를 로그로 출력합니다.
    link-base-url: http://localhost:5199/reset-password

logging:
  level:
    com.fungame.songquiz: DEBUG
