plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java-test-fixtures'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

dependencies {
    implementation project(':backend:core:core-enum')

    // 엔티티가 달고 있는 애노테이션이라 db-core 가 공개하는 타입의 일부다.
    // 없으면 core-api 컴파일 때 "unknown enum constant" 경고가 백 개 넘게 쏟아진다.
    api 'jakarta.persistence:jakarta.persistence-api'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}"
    implementation "io.github.openfeign.querydsl:querydsl-core:${queryDslVersion}"

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jpa"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 통합 테스트는 픽스처를 준비하려고 리포지토리를 직접 쓴다.
    // 테스트 스코프에만 열고 프로덕션 클래스패스에는 내보내지 않는다.
    testFixturesApi 'org.springframework.boot:spring-boot-starter-data-jpa'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:junit-jupiter'
    testFixturesApi 'org.testcontainers:mysql'
}
