spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 전용 호스트의 Redis 는 ACL 로 막혀 있습니다. 값은 서버 .env 로만 들어옵니다.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
management:
  health:
    redis:
      # 켜 두면 Redis 가 잠깐 흔들릴 때 헬스체크가 DOWN 이 되어 배포가 롤백되고
      # 로드밸런서가 멀쩡히 서빙 중인 인스턴스를 빼 버립니다.
      # 지금은 Redis 가 끊겨도 로컬 STOMP 전달이 유지되므로 앱이 아픈 것이 아닙니다.
      # 전달을 전부 스트림 경유로 바꾸면(계획 문서 §1.3) 그때는 다시 켜야 합니다.
      # 자격 증명이 틀렸는지는 배포 워크플로가 앱을 건드리기 전에 따로 확인합니다.
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      port: ${REDIS_PORT:16379}
