spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 전용 호스트의 Redis 는 ACL 로 막혀 있습니다. 값은 서버 .env 로만 들어옵니다.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
---
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      port: ${REDIS_PORT:16379}
