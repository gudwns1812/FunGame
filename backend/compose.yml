services:
  caddy:
    image: caddy:2
    container_name: fungame-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/gudwns1812/fungame-backend:latest}
    container_name: fungame-backend
    restart: unless-stopped
    # server.shutdown=graceful 의 timeout-per-shutdown-phase 가 20s 입니다.
    # 도커 기본 유예 10s 로는 그 페이즈가 끝나기 전에 SIGKILL 이 들어옵니다.
    stop_grace_period: 30s
    expose:
      - "8080"
    ports:
      # 관리 포트. prometheus 가 사설망으로 긁어갑니다.
      # 넣을 값은 긁어가는 쪽이 아니라 **이 호스트 자신의 사설 IP** 입니다.
      - "${MANAGEMENT_BIND_IP:-127.0.0.1}:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # MySQL 은 전용 호스트에 있습니다. 값은 배포 워크플로가 Secret 에서 .env 로 채웁니다.
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/fungame
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # MAIL_FROM · MAIL_HOST · PASSWORD_RESET_LINK_BASE_URL 은 넘기지 않습니다.
      # yml 기본값이 이미 운영값이고, .env 에 없으면 빈 문자열이 그 기본값을 덮습니다.
      # Brevo SMTP 계정. 배포 워크플로가 GitHub Secret 에서 서버 .env 로 채웁니다.
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 신고 알림을 받을 디스코드 웹훅. 정답과 힌트까지 실리므로 비공개 채널이어야 합니다.
      # 주소를 아는 사람은 누구나 그 채널에 메시지를 쏠 수 있으므로 .env 에만 둡니다.
      DISCORD_REPORT_WEBHOOK_URL: ${DISCORD_REPORT_WEBHOOK_URL}
      # Redis 도 전용 호스트에 있습니다.
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  caddy-data:
  caddy-config:
