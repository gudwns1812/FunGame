plugins {
    id 'org.springframework.boot' version '3.4.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.asciidoctor.jvm.convert' version '4.0.2' apply false
}

ext {
    lombokVersion = '1.18.36'
    queryDslVersion = '7.0'
    // Docker Engine 29+ (ubuntu-latest 등) 가 API 1.40 미만 요청을 거부해
    // Spring Boot 3.4.3 기본 Testcontainers(1.20.5, API 1.32) 가 실패한다.
    set('testcontainers.version', '1.21.4')
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }

    tasks.withType(Test).configureEach {
        boolean runningOnCi = System.getenv('CI') != null
        environment 'TESTCONTAINERS_REUSE_ENABLE', String.valueOf(!runningOnCi)
    }
}
