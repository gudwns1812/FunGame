# MySQL 전용 호스트의 compose 입니다.
#
# 앱 호스트의 compose.yml 과 **네트워크를 공유하지 않습니다.** 앱은 MYSQL_HOST 로 TCP 로만 붙습니다.
# 그래서 이 파일을 로컬에서 띄우면 전용 호스트 역할을 그대로 대신할 수 있습니다:
#
#   docker compose -f compose.db.yml --env-file .env up -d
#   MYSQL_HOST=host.docker.internal docker compose up -d backend
#
# 운영에서는 MYSQL_BIND_IP 에 **이 호스트 자신의 사설 IP** 를 넣습니다. 비워 두면 127.0.0.1 에만
# 묶여 앱 호스트가 붙지 못합니다. 0.0.0.0 으로 열지 않습니다 — 지금까지 DB 가 인터넷에 열려
# 있었고 보안 그룹이 유일한 방어선이었습니다.

services:
  mysql:
    image: mysql:8.0
    container_name: fungame-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fungame
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_BIND_IP:-127.0.0.1}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
