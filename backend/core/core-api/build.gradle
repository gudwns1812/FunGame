plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.asciidoctor.jvm.convert'
}

description = 'songquiz'

configurations {
    asciidoctorExtensions
}

dependencies {
    implementation project(':backend:core:core-enum')
    implementation project(':backend:storage:db-core')
    implementation project(':backend:clients:client-youtube')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // @MessageMapping 핸들러에서 @AuthenticationPrincipal 을 쓰기 위한 모듈.
    // starter-security 에는 포함되지 않는다.
    implementation 'org.springframework.security:spring-security-messaging'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation platform('software.amazon.awssdk:bom:2.31.30')
    implementation 'software.amazon.awssdk:sesv2'

    testImplementation testFixtures(project(':backend:storage:db-core'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

ext {
    snippetsDir = file('build/generated-snippets')
}

tasks.named('test') {
    outputs.dir snippetsDir

    useJUnitPlatform {
        // external 은 실제 외부 서비스를 호출해 결과가 우리 코드와 무관하게 바뀐다.
        // 평소에는 제외하고, 확인이 필요할 때만 -PexternalTests 로 실행한다.
        if (!project.hasProperty('externalTests')) {
            excludeTags 'external'
        }
    }
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    configurations 'asciidoctorExtensions'
    dependsOn test
}

bootJar {
    dependsOn asciidoctor
    from ("${asciidoctor.outputDir}/html5") {
        into 'static/docs'
    }
}
