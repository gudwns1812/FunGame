# 공통 설정. 버전 관리 대상이고 이미지에도 포함됩니다.
#
# 비밀값이나 환경마다 달라지는 값은 파일에 직접 쓰지 말고 ${ENV_VAR:기본값} 으로 두세요.
# 실제 값은 서버의 .env 가 주입합니다. (docker run --env-file .env ...)
# 기본값을 달아두었으므로 .env 없이도 기동은 됩니다.

cors:
  # 프론트엔드 오리진. 쉼표로 여러 개 지정할 수 있습니다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.fun-game.club,https://fun-game.club}
aws:
  # SES 아이덴티티를 만든 리전. prod 프로파일에서만 SES 클라이언트가 생성됩니다.
  region: ${AWS_REGION:ap-northeast-2}
app:
  mail:
    # SES 에 verify 된 발신 주소여야 합니다.
    from: ${MAIL_FROM:no-reply@fun-game.club}
  password-reset:
    # 메일에 실리는 재설정 페이지 주소. 뒤에 ?token=... 이 붙습니다.
    link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:https://www.fun-game.club/reset-password}
spring:
  # DB 설정은 storage:db-core 모듈이 소유합니다.
  config:
    import: classpath:db-core.yml
server:
  servlet:
    session:
      cookie:
        http-only: true
        # http://localhost 로 로컬 개발할 때만 false 로 내리세요.
        secure: ${SESSION_COOKIE_SECURE:true}
        # www.fun-game.club 과 api.fun-game.club 은 등록 가능 도메인(fun-game.club)이
        # 같아서 same-site 요청으로 취급되므로 lax 로도 쿠키가 전달됩니다.
        # 이 앱은 CSRF 보호가 꺼져 있어(SecurityConfig) lax 가 사실상 주요 CSRF 방어선입니다.
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
