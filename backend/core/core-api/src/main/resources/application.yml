# 공통 설정. 버전 관리 대상이고 이미지에도 포함됩니다.
#
# 비밀값이나 환경마다 달라지는 값은 파일에 직접 쓰지 말고 ${ENV_VAR:기본값} 으로 두세요.
# 실제 값은 서버의 .env 가 주입합니다. (docker run --env-file .env ...)
# 기본값을 달아두었으므로 .env 없이도 기동은 됩니다.

cors:
  # 프론트엔드 오리진. 쉼표로 여러 개 지정할 수 있습니다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.fun-game.club,https://fun-game.club}
app:
  broadcast:
    # 다른 인스턴스로 내보낼 방송이 쌓이는 큐. 호출 스레드는 넣기만 하고 워커 하나가 Redis 로 보냅니다.
    # 가득 차면 가장 오래된 것부터 버립니다. payload 대부분이 전체 스냅샷이라 새것이 옛것을 덮습니다.
    queue-capacity: ${BROADCAST_QUEUE_CAPACITY:1000}
    # 이 시간을 넘긴 방송은 보내지 않고 버립니다. 크로스 인스턴스 전달 지연의 상한입니다.
    # 500ms 로 뒀더니 접속자 500명에서 접속자 목록 팬아웃(뷰어당 1건)이 그 한계를 넘겨
    # 30초에 256건이 조용히 버려졌습니다. 그 팬아웃을 1건으로 줄이기 전까지는 2초가 필요합니다.
    max-age-millis: ${BROADCAST_MAX_AGE_MILLIS:2000}
  password-reset:
    # 메일에 실리는 재설정 페이지 주소. 뒤에 ?token=... 이 붙습니다.
    link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:https://www.fun-game.club/reset-password}
spring:
  application:
    name: fungame-backend
  cache:
    type: caffeine
    caffeine:
      # 닉네임 변경은 캐시를 바로 갱신한다(write-through). TTL 은 인스턴스가 여러 대일 때
      # 다른 노드가 옛 값을 들고 있는 시간의 상한이다. Redis 로 바꾸면 그 상한이 필요 없어진다.
      spec: expireAfterWrite=5m
  # 모듈이 자기 설정을 갖고 core-api 가 가져옵니다.
  config:
    import:
      - classpath:db-core.yml
      - classpath:redis-core.yml
      - classpath:client-mail.yml
      - classpath:client-discord.yml
      - classpath:monitoring.yml
server:
  servlet:
    session:
      cookie:
        http-only: true
        # http://localhost 로 로컬 개발할 때만 false 로 내리세요.
        secure: ${SESSION_COOKIE_SECURE:true}
        # www.fun-game.club 과 api.fun-game.club 은 등록 가능 도메인(fun-game.club)이
        # 같아서 same-site 요청으로 취급되므로 lax 로도 쿠키가 전달됩니다.
        # 이 앱은 CSRF 보호가 꺼져 있어(SecurityConfig) lax 가 사실상 주요 CSRF 방어선입니다.
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
